<!DOCTYPE html>
<html>
<head>
    <title>Bug Bounty Recon Toolkit</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            font-family: "Segoe UI", Tahoma, sans-serif;
            color: #f5f5f5;
        }

        .background-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
            filter: brightness(0.4);
        }

        .container {
            text-align: center;
            margin-top: 15vh;
        }

        h1 {
            font-size: 2.2em;
            margin-bottom: 0.5em;
            color: #00ffcc;
            letter-spacing: 1px;
        }

        p {
            color: #ccc;
            margin-bottom: 1.5em;
            font-size: 1em;
        }

        input[type="text"] {
            padding: 12px;
            width: 320px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            outline: none;
            transition: box-shadow 0.3s ease;
        }

        input[type="text"]:focus {
            box-shadow: 0 0 10px #00ffcc;
        }

        button {
            padding: 12px 22px;
            margin-left: 8px;
            background-color: #00ffcc;
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
        }

        button:hover {
            background-color: #00e6b8;
            transform: scale(1.05);
        }

        small {
            display: block;
            margin-top: 2em;
            color: #888;
            font-size: 0.85em;
        }

        kbd {
            background: #333;
            padding: 2px 6px;
            border-radius: 4px;
            color: #fff;
        }
    </style>
</head>
<body>
    <video autoplay muted loop class="background-video">
        <source src="cyber-bg.mp4" type="video/mp4">
    </video>

    <div class="container">
        <h1>Bug Bounty Recon Toolkit</h1>
        <p>Enter a domain to explore reconnaissance and discovery tools.</p>

        <input type="text" id="domainInput" placeholder="example.com">
        <button id="goBtn">Run</button>

        <small>
            Use <kbd>Tab</kbd> to navigate, <kbd>Enter</kbd> to run queries.<br>
            Test only systems you are authorized to access.
        </small>
    </div>
</body>
</html>
